name: Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/android-build.log
          exit ${PIPESTATUS[0]}
      - name: Publicar log en ci-logs
        if: always()
        run: |
          mkdir -p /tmp/logs && tail -n 400 /tmp/android-build.log > /tmp/logs/android-build.log || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git fetch origin ci-logs || true
          if git rev-parse origin/ci-logs >/dev/null 2>&1; then git checkout -B ci-logs origin/ci-logs; else git checkout --orphan ci-logs; git rm -rf . >/dev/null; fi
          cp /tmp/logs/android-build.log . && git add android-build.log && git commit -m "log android $GITHUB_SHA" || true
          git push origin ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: DealHunterAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
