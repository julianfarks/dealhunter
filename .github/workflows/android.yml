name: Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Aceptar licencias del SDK (el runner ya trae el SDK de Android)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee /tmp/android-build.log
          exit ${PIPESTATUS[0]}
      - name: Publicar log en ci-logs-android
        if: always()
        run: |
          mkdir -p /tmp/logs && tail -n 400 /tmp/android-build.log > /tmp/logs/android-build.log || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git fetch origin ci-logs-android || true
          if git rev-parse origin/ci-logs-android >/dev/null 2>&1; then git checkout -B ci-logs-android origin/ci-logs-android; else git checkout --orphan ci-logs-android; git rm -rf . >/dev/null; fi
          cp /tmp/logs/android-build.log . && git add android-build.log && git commit -m "log android $GITHUB_SHA" || true
          git push origin ci-logs-android
      - uses: actions/upload-artifact@v4
        with:
          name: DealHunterAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar el APK en el repositorio (releases/) y crear un Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git checkout -q main || git checkout -q -B main origin/main
          git pull -q --rebase origin main
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/DealHunterAI-debug.apk
          sha256sum releases/DealHunterAI-debug.apk | tee releases/DealHunterAI-debug.apk.sha256
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add releases
          git commit -m "APK de depuración (compilado por GitHub Actions, run ${{ github.run_number }}) [skip ci]" || true
          git push origin main
          gh release create "debug-${{ github.run_number }}" releases/DealHunterAI-debug.apk releases/DealHunterAI-debug.apk.sha256 \
            --title "DealHunter AI (debug) #${{ github.run_number }}" \
            --notes "APK de depuración compilado por GitHub Actions desde el commit ${{ github.sha }}. No es una versión de Google Play. Lee docs/limitaciones.md."
